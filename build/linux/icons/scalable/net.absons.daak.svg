<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Daak app icon: envelope in #0C5EF6, full width, transparent background.
       Vector redraw of the approved envelope mark, stretched ~12% taller
       about the centre; geometry measured from the raster master
       (envelope 0-512 x 44-468, corner radii rx 75, ry 84; V flap from
       the side edges at y=136 to the centre apex at y=322, band 44 wide). -->
  <defs>
    <mask id="daak-flap">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <polyline points="0,136 256,322 512,136" fill="none" stroke="#000000" stroke-width="44" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect x="0" y="44" width="512" height="424" rx="75" ry="84" fill="#0C5EF6" mask="url(#daak-flap)"/>
</svg>
