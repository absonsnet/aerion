app-id: net.absons.daak
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: daak

finish-args:
  # Network access for email sync
  - --share=network
  # IPC is required for X11 and Wayland
  - --share=ipc
  # Display access
  - --socket=wayland
  - --socket=fallback-x11
  # GPU access for hardware acceleration
  - --device=dri
  # Sleep/wake detection for sync management
  - --system-talk-name=org.freedesktop.login1

modules:
  - name: daak
    buildsystem: simple
    build-commands:
      # Install pre-built binary from host
      - install -Dm755 build/bin/daak /app/bin/daak

      # Install desktop file with correct app ID
      - install -Dm644 build/linux/daak.desktop /app/share/applications/net.absons.daak.desktop
      - desktop-file-edit --set-key=Icon --set-value=net.absons.daak /app/share/applications/net.absons.daak.desktop
      - desktop-file-edit --set-key=Exec --set-value='daak %U' /app/share/applications/net.absons.daak.desktop

      # Install themed icons (32-256 + scalable). A lone 256 is skipped by
      # hicolor MinSize=64 at small lookup sizes (#395).
      - |
        for sz in 32 48 64 128 256; do
          install -Dm644 "build/linux/icons/${sz}x${sz}/net.absons.daak.png" \
            "/app/share/icons/hicolor/${sz}x${sz}/apps/net.absons.daak.png"
        done
      - install -Dm644 build/linux/icons/scalable/net.absons.daak.svg /app/share/icons/hicolor/scalable/apps/net.absons.daak.svg

      # Install metainfo (AppStream metadata)
      - install -Dm644 build/flatpak/net.absons.daak.metainfo.xml /app/share/metainfo/net.absons.daak.metainfo.xml

    sources:
      - type: dir
        path: ../..
