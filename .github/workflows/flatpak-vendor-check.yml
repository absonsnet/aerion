# Fails the build if the committed Flatpak Go-module vendoring files
# (build/flatpak/flathub/go.mod.yml + modules.txt) are stale relative to
# go.mod/go.sum. Those files are generated by flatpak-go-mod and the Flatpak
# release step builds with `go build -mod=vendor` from them, so a stale
# manifest breaks the release with "inconsistent vendoring" — and re-running
# the failed jobs cannot fix it. This check catches the staleness at push/PR
# time instead, with a clear message about how to regenerate.
name: Flatpak vendoring check

on:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - build/flatpak/flathub/go.mod.yml
      - build/flatpak/flathub/modules.txt
      - .github/workflows/flatpak-vendor-check.yml
  pull_request:
    paths:
      - go.mod
      - go.sum
      - build/flatpak/flathub/go.mod.yml
      - build/flatpak/flathub/modules.txt
      - .github/workflows/flatpak-vendor-check.yml

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate vendoring files to a temp dir
        run: |
          go install github.com/dennwc/flatpak-go-mod@latest
          mkdir -p .flatpak-vendor-check
          # NOTE: -out must live on the same filesystem as the repo (the
          # tool renames vendor/modules.txt into it), so use an in-repo
          # temp dir, never /tmp.
          "$(go env GOPATH)/bin/flatpak-go-mod" -out .flatpak-vendor-check
          rm -rf vendor

      - name: Diff against the committed files
        run: |
          if ! diff -u build/flatpak/flathub/go.mod.yml .flatpak-vendor-check/go.mod.yml \
            || ! diff -u build/flatpak/flathub/modules.txt .flatpak-vendor-check/modules.txt; then
            echo "::error::Flatpak vendoring files are stale (go.mod/go.sum changed without regenerating them). Run ./build/flatpak/flathub/regen-vendor.sh locally and commit build/flatpak/flathub/go.mod.yml + modules.txt."
            exit 1
          fi
          echo "Flatpak vendoring files are up to date."

      - name: Clean up
        if: always()
        run: rm -rf .flatpak-vendor-check vendor
